name: CI

on:
  push:
    branches: [main, fix/full-test-suite]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jobpilot_test
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpilot -d jobpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: test-secret
      APP_ENCRYPTION_KEY: ""
      DATABASE_URL: postgresql://jobpilot:jobpilot@127.0.0.1:5432/jobpilot_test?serverVersion=17&charset=utf8
      ARBEITNOW_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, iconv, intl, json, mbstring, pdo_pgsql, sodium, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Install backend dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare initial data
        run: cp -R initial-data api/initial-data
      - name: Validate Symfony configuration
        working-directory: api
        run: |
          php bin/console lint:yaml --parse-tags config
          php bin/console lint:container
      - name: Create test database
        working-directory: api
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console app:bootstrap --no-interaction
          echo "Doctrine schema difference:"
          php bin/console doctrine:schema:update --dump-sql
          php bin/console doctrine:schema:validate
      - name: Run PHPUnit
        working-directory: api
        run: php bin/phpunit

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run frontend unit tests
        run: npm run test:unit
      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: /api
          API_INTERNAL_URL: http://127.0.0.1:8080
        run: npm run build

  compose-config:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate image-only configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate local development configuration
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet

  e2e:
    name: Chromium end-to-end tests
    needs: [backend, frontend, compose-config]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jobpilot_e2e
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpilot -d jobpilot_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: e2e-secret
      APP_ENCRYPTION_KEY: ""
      DATABASE_URL: postgresql://jobpilot:jobpilot@127.0.0.1:5432/jobpilot_e2e?serverVersion=17&charset=utf8
      ARBEITNOW_ENABLED: 0
      LE_STUDIO_TECH_ENABLED: 0
      NEXT_PUBLIC_API_URL: /api
      API_INTERNAL_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, iconv, intl, json, mbstring, pdo_pgsql, sodium, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Pin PHP 8.4 executable
        shell: bash
        run: |
          set -euo pipefail
          php_bin="$(readlink -f "$(command -v php)")"
          "$php_bin" -r 'if (version_compare(PHP_VERSION, "8.4.1", "<")) { fwrite(STDERR, "PHP >= 8.4.1 required\n"); exit(1); }'
          echo "PHP_BIN=$php_bin" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare isolated Chromium runtime
        run: docker build --tag jobpilot-browser-worker:ci browser-worker

      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build Next.js for browser tests
        working-directory: web
        run: npm run build

      - name: Prepare E2E database
        run: |
          cp -R initial-data api/initial-data
          cd api
          "$PHP_BIN" bin/console doctrine:migrations:migrate --no-interaction
          "$PHP_BIN" bin/console app:bootstrap --no-interaction

      - name: Configure Symfony HTTP runtime
        run: |
          cat > api/.env.local <<'EOF'
          APP_ENV=dev
          APP_DEBUG=1
          APP_SECRET=e2e-secret
          APP_ENCRYPTION_KEY=
          DATABASE_URL=postgresql://jobpilot:jobpilot@127.0.0.1:5432/jobpilot_e2e?serverVersion=17&charset=utf8
          ARBEITNOW_ENABLED=0
          LE_STUDIO_TECH_ENABLED=0
          ADZUNA_APP_ID=
          ADZUNA_APP_KEY=
          EOF
          rm -rf api/var/cache/dev

      - name: Start Symfony API
        run: |
          cd api
          nohup env APP_ENV=dev APP_DEBUG=1 "$PHP_BIN" -S 127.0.0.1:8080 -t public public/index.php > /tmp/jobpilot-api.log 2>&1 &
          echo $! > /tmp/jobpilot-api.pid

      - name: Wait for Symfony API and database endpoints
        run: |
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --show-error --silent http://127.0.0.1:8080/api/health >/dev/null || {
            cat /tmp/jobpilot-api.log || true
            exit 1
          }
          curl --fail --show-error --silent http://127.0.0.1:8080/api/profile >/tmp/jobpilot-profile.json || {
            cat /tmp/jobpilot-api.log || true
            exit 1
          }
          curl --fail --show-error --silent http://127.0.0.1:8080/api/dashboard >/tmp/jobpilot-dashboard.json || {
            cat /tmp/jobpilot-api.log || true
            exit 1
          }

      - name: Start Next.js production server
        working-directory: web
        run: |
          nohup npm run start > /tmp/jobpilot-web.log 2>&1 &
          echo $! > /tmp/jobpilot-web.pid

      - name: Wait for Next.js
        run: |
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/jobpilot-api.log || true
          cat /tmp/jobpilot-web.log || true
          exit 1

      - name: Run Playwright in isolated browser container
        run: |
          docker run --rm \
            --network host \
            --ipc host \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env CI=true \
            --env PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 \
            --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --volume "$PWD/web:/workspace" \
            --volume "$PWD/extension:/extension:ro" \
            --workdir /workspace \
            jobpilot-browser-worker:ci \
            npm run test:e2e

      - name: Show application logs on failure
        if: failure()
        run: |
          cat /tmp/jobpilot-api.log || true
          cat /tmp/jobpilot-web.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop application servers
        if: always()
        run: |
          test ! -f /tmp/jobpilot-web.pid || kill "$(cat /tmp/jobpilot-web.pid)" || true
          test ! -f /tmp/jobpilot-api.pid || kill "$(cat /tmp/jobpilot-api.pid)" || true
