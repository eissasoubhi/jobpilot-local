parameters:
  upload_dir: '%kernel.project_dir%/var/private/cvs'
  private_dir: '%kernel.project_dir%/var/private'
  initial_data_dir: '%kernel.project_dir%/initial-data'
  env(ADZUNA_APP_ID): ''
  env(ADZUNA_APP_KEY): ''
  env(ADZUNA_COUNTRY): 'fr'
  env(ADZUNA_WHERE): ''
  env(ADZUNA_RESULTS_PER_QUERY): '20'
  env(FRANCE_TRAVAIL_CLIENT_ID): ''
  env(FRANCE_TRAVAIL_CLIENT_SECRET): ''
  env(FRANCE_TRAVAIL_SCOPE): 'api_offresdemploiv2 o2dsoffre'
  env(FRANCE_TRAVAIL_TOKEN_ENDPOINT): 'https://entreprise.francetravail.fr/connexion/oauth2/access_token?realm=/partenaire'
  env(FRANCE_TRAVAIL_SEARCH_ENDPOINT): 'https://api.francetravail.io/partenaire/offresdemploi/v2/offres/search'
  env(FRANCE_TRAVAIL_RESULTS_PER_QUERY): '50'
  env(SMARTRECRUITERS_API_TOKEN): ''
  env(SMARTRECRUITERS_COMPANY_IDENTIFIERS): ''
  env(SMARTRECRUITERS_PAGES): '1'
  env(SMARTRECRUITERS_RESULTS_PER_PAGE): '100'
  env(SMARTRECRUITERS_MAX_DETAILS): '20'
  env(ARBEITNOW_ENABLED): '1'
  env(ARBEITNOW_PAGES): '3'
  env(SYMFONY_JOBS_RSS_ENABLED): '1'
  env(JOB_SYNC_INTERVAL_SECONDS): '21600'
  env(CONNECTOR_ALERT_WEBHOOK_URL): ''
  env(CONNECTOR_ALERT_WEBHOOK_ALLOWED_HOST): ''
  env(CONNECTOR_ALERT_WEBHOOK_SECRET): ''
  env(AI_MATCHING_ENABLED): '0'
  env(GEMINI_API_KEY): ''
  env(GEMINI_MATCHING_MODEL): 'gemini-3.5-flash-lite'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  _instanceof:
    App\JobDiscovery\Domain\Connector\JobSourceConnector:
      tags: ['app.job_source_connector']

  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'

  App\Service\CvStorage:
    arguments:
      $uploadDir: '%upload_dir%'

  App\Service\GmailTokenStore:
    arguments:
      $privateDir: '%private_dir%'
      $encryptionKey: '%env(APP_ENCRYPTION_KEY)%'

  App\Service\ArbeitnowJobProvider:
    arguments:
      $enabled: '%env(bool:ARBEITNOW_ENABLED)%'
      $pages: '%env(int:ARBEITNOW_PAGES)%'

  App\Service\AdzunaJobProvider:
    arguments:
      $appId: '%env(ADZUNA_APP_ID)%'
      $appKey: '%env(ADZUNA_APP_KEY)%'
      $country: '%env(ADZUNA_COUNTRY)%'
      $where: '%env(ADZUNA_WHERE)%'
      $resultsPerQuery: '%env(int:ADZUNA_RESULTS_PER_QUERY)%'

  App\Service\FranceTravailJobProvider:
    arguments:
      $clientId: '%env(FRANCE_TRAVAIL_CLIENT_ID)%'
      $clientSecret: '%env(FRANCE_TRAVAIL_CLIENT_SECRET)%'
      $scope: '%env(FRANCE_TRAVAIL_SCOPE)%'
      $tokenEndpoint: '%env(FRANCE_TRAVAIL_TOKEN_ENDPOINT)%'
      $searchEndpoint: '%env(FRANCE_TRAVAIL_SEARCH_ENDPOINT)%'
      $resultsPerQuery: '%env(int:FRANCE_TRAVAIL_RESULTS_PER_QUERY)%'

  App\Service\SmartRecruitersJobProvider:
    arguments:
      $apiToken: '%env(SMARTRECRUITERS_API_TOKEN)%'
      $companyIdentifiers: '%env(SMARTRECRUITERS_COMPANY_IDENTIFIERS)%'
      $pages: '%env(int:SMARTRECRUITERS_PAGES)%'
      $resultsPerPage: '%env(int:SMARTRECRUITERS_RESULTS_PER_PAGE)%'
      $maxDetails: '%env(int:SMARTRECRUITERS_MAX_DETAILS)%'

  App\Service\SymfonyJobsRssProvider:
    arguments:
      $enabled: '%env(bool:SYMFONY_JOBS_RSS_ENABLED)%'

  App\Service\Ai\AiJobMatchAnalyzerInterface: '@App\Service\Ai\GeminiJobMatchAnalyzer'

  App\Service\Ai\GeminiJobMatchAnalyzer:
    arguments:
      $enabled: '%env(bool:AI_MATCHING_ENABLED)%'
      $apiKey: '%env(GEMINI_API_KEY)%'
      $model: '%env(GEMINI_MATCHING_MODEL)%'

  App\JobDiscovery\Application\ConnectorRegistry:
    arguments:
      $connectors: !tagged_iterator app.job_source_connector

  App\JobDiscovery\Infrastructure\Scraping\Http\HttpScrapingStateStore:
    arguments:
      $directory: '%private_dir%/http-scraping/state'

  App\JobDiscovery\Infrastructure\Scraping\Http\RobotsTxtGuard:
    arguments:
      $cacheDirectory: '%private_dir%/http-scraping/robots'

  App\JobDiscovery\Infrastructure\Monitoring\ConnectorAlertWebhookNotifier:
    arguments:
      $stateFile: '%private_dir%/monitoring/connector-alert-webhook.json'
      $webhookUrl: '%env(CONNECTOR_ALERT_WEBHOOK_URL)%'
      $allowedHost: '%env(CONNECTOR_ALERT_WEBHOOK_ALLOWED_HOST)%'
      $signingSecret: '%env(CONNECTOR_ALERT_WEBHOOK_SECRET)%'

  App\Service\JobSearchSyncService:
    arguments:
      $privateDir: '%private_dir%'
      $intervalSeconds: '%env(int:JOB_SYNC_INTERVAL_SECONDS)%'

  App\Command\BootstrapCommand:
    arguments:
      $initialDataDir: '%initial_data_dir%'
