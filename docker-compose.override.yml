services:
  api:
    entrypoint: ["sh", "./docker-entrypoint.sh"]
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor
      - api_cache:/app/var/cache
      - api_logs:/app/var/log
      - ./initial-data:/app/initial-data:ro
      - jobpilot_private:/app/var/private

  scheduler:
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor
      - api_cache:/app/var/cache
      - api_logs:/app/var/log
      - ./initial-data:/app/initial-data:ro
      - jobpilot_private:/app/var/private

  web:
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next

volumes:
  api_vendor:
  api_cache:
  api_logs:
  web_node_modules:
  web_next:
