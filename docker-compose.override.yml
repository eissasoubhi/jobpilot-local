services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  api:
    entrypoint: ["sh", "./docker-entrypoint.sh"]
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor
      - api_cache:/app/var/cache
      - api_logs:/app/var/log
      - ./initial-data:/app/initial-data:ro
      - ./data/private:/app/var/private

  scheduler:
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor
      - api_cache:/app/var/cache
      - api_logs:/app/var/log
      - ./initial-data:/app/initial-data:ro
      - ./data/private:/app/var/private

  private-storage-migrator:
    image: alpine:3.20
    profiles: ["tools"]
    command:
      - sh
      - -c
      - |
        mkdir -p /target
        cp -a /source/. /target/
        echo "Private files copied to ./data/private"
    volumes:
      - jobpilot_private:/source:ro
      - ./data/private:/target

  web:
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    tmpfs:
      - /app/.next

  storybook:
    build:
      context: ./web
    restart: unless-stopped
    command: ["npm", "run", "storybook", "--", "--host", "0.0.0.0"]
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${STORYBOOK_PORT:-6006}:6006"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6006').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

volumes:
  api_vendor:
  api_cache:
  api_logs:
  web_node_modules:
