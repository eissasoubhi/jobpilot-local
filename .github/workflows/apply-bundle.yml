name: Apply consolidated fixes

on:
  push:
    branches: [fix/full-test-suite-2]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[bundle applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-test-suite-2
          fetch-depth: 0
      - name: Apply audited source bundle
        run: python3 tools/apply_bundle.py
      - name: Remove temporary bundle files
        run: rm -f tools/bundle.part* tools/apply_bundle.py .github/workflows/apply-bundle.yml
      - name: Commit consolidated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply audited fixes and test suite [bundle applied]"
          git push origin HEAD:fix/full-test-suite-2
