name: Development Cockpit Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: development-cockpit-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Projects token
        shell: bash
        env:
          COCKPIT_TOKEN: ${{ secrets.DEVELOPMENT_COCKPIT_TOKEN }}
        run: |
          if [ -z "$COCKPIT_TOKEN" ]; then
            echo "Missing repository secret DEVELOPMENT_COCKPIT_TOKEN."
            echo "Create a classic PAT with repo + project scopes and save it under that name."
            exit 1
          fi

      - name: Create and synchronize GitHub Project
        uses: actions/github-script@v9
        env:
          COCKPIT_CONFIG: .github/development-cockpit.json
        with:
          github-token: ${{ secrets.DEVELOPMENT_COCKPIT_TOKEN }}
          script: |
            const fs = require('fs');

            const config = JSON.parse(fs.readFileSync(process.env.COCKPIT_CONFIG, 'utf8'));
            const owner = config.owner;
            const projectTitle = config.projectTitle;
            const repositories = config.repositories;

            const statuses = [
              { name: 'Backlog', color: 'GRAY', description: 'Planned, not ready to start yet.' },
              { name: 'Todo', color: 'BLUE', description: 'Ready to be worked on.' },
              { name: 'In Progress', color: 'YELLOW', description: 'Actively being implemented.' },
              { name: 'PR Open', color: 'PURPLE', description: 'Implementation has an open pull request.' },
              { name: 'CI / Review', color: 'ORANGE', description: 'Waiting for CI, review or merge decision.' },
              { name: 'Blocked', color: 'RED', description: 'Blocked by failing CI, evidence or an external decision.' },
              { name: 'Done', color: 'GREEN', description: 'Merged or otherwise completed.' },
            ];

            const statusByLowerName = new Map(statuses.map((status) => [status.name.toLowerCase(), status.name]));

            function marker(body, key) {
              const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = String(body || '').match(new RegExp(`<!--\\s*cockpit:${escaped}=([\\s\\S]*?)-->`, 'i'));
              return match ? match[1].trim() : null;
            }

            function labelNames(content) {
              return new Set((content.labels?.nodes || []).map((label) => label.name.toLowerCase()));
            }

            function explicitStatus(body) {
              const value = marker(body, 'status');
              return value ? statusByLowerName.get(value.toLowerCase()) || null : null;
            }

            function inferStatus(content) {
              if (content.__typename === 'Issue' && content.state === 'CLOSED') return 'Done';
              if (content.__typename === 'PullRequest' && (content.merged || content.state === 'CLOSED')) return 'Done';

              const manual = explicitStatus(content.body);
              if (manual) return manual;

              const labels = labelNames(content);
              if (labels.has('status:blocked')) return 'Blocked';
              if (labels.has('status:backlog')) return 'Backlog';
              if (labels.has('status:in-progress') && content.__typename === 'Issue') return 'In Progress';

              if (content.__typename === 'Issue') return 'Todo';

              const checkState = content.commits?.nodes?.[0]?.commit?.statusCheckRollup?.state || null;
              if (labels.has('status:blocked') || checkState === 'FAILURE' || checkState === 'ERROR') return 'Blocked';
              if (content.isDraft) return 'PR Open';
              if (checkState === 'PENDING' || checkState === 'EXPECTED' || checkState === 'SUCCESS') return 'CI / Review';
              return 'PR Open';
            }

            function inferProgress(content) {
              const explicit = Number(marker(content.body, 'progress'));
              if (Number.isFinite(explicit) && explicit >= 0 && explicit <= 100) return Math.round(explicit);
              if ((content.__typename === 'Issue' && content.state === 'CLOSED') ||
                  (content.__typename === 'PullRequest' && (content.merged || content.state === 'CLOSED'))) return 100;

              const tasks = [...String(content.body || '').matchAll(/^\s*[-*]\s+\[([ xX])\]/gm)];
              if (!tasks.length) return null;
              const done = tasks.filter((task) => task[1].toLowerCase() === 'x').length;
              return Math.round((done / tasks.length) * 100);
            }

            const ownerData = await github.graphql(`
              query($login: String!) {
                user(login: $login) {
                  id
                  projectsV2(first: 100) {
                    nodes { id number title closed }
                  }
                }
              }
            `, { login: owner });

            if (!ownerData.user) throw new Error(`GitHub user ${owner} was not found or is not visible to the token.`);

            let project = ownerData.user.projectsV2.nodes.find((candidate) => candidate.title === projectTitle && !candidate.closed);
            if (!project) {
              const created = await github.graphql(`
                mutation($ownerId: ID!, $title: String!) {
                  createProjectV2(input: { ownerId: $ownerId, title: $title }) {
                    projectV2 { id number title }
                  }
                }
              `, { ownerId: ownerData.user.id, title: projectTitle });
              project = created.createProjectV2.projectV2;
              core.info(`Created ${projectTitle} (#${project.number}).`);
            } else {
              core.info(`Using existing ${projectTitle} (#${project.number}).`);
            }

            await github.graphql(`
              mutation($projectId: ID!, $description: String!, $readme: String!) {
                updateProjectV2(input: {
                  projectId: $projectId,
                  public: false,
                  shortDescription: $description,
                  readme: $readme
                }) { projectV2 { id } }
              }
            `, {
              projectId: project.id,
              description: 'Live development cockpit for ChatGPT-managed GitHub roadmaps, issues, PRs and CI.',
              readme: 'Source of truth: GitHub Issues, pull requests and CI. Hidden `cockpit:*` markers in issue/PR bodies allow ChatGPT to update chantier, next step, progress and manual status without duplicating roadmap state.'
            });

            const labelDefinitions = [
              { name: 'status:backlog', color: '6e7781', description: 'Development cockpit: planned backlog item.' },
              { name: 'status:in-progress', color: 'd4c5f9', description: 'Development cockpit: actively being worked on.' },
              { name: 'status:blocked', color: 'd73a4a', description: 'Development cockpit: blocked by CI, evidence or a decision.' },
            ];

            for (const fullName of repositories) {
              const [repoOwner, repo] = fullName.split('/');
              const repository = await github.rest.repos.get({ owner: repoOwner, repo });

              try {
                await github.graphql(`
                  mutation($projectId: ID!, $repositoryId: ID!) {
                    linkProjectV2ToRepository(input: { projectId: $projectId, repositoryId: $repositoryId }) {
                      repository { id }
                    }
                  }
                `, { projectId: project.id, repositoryId: repository.data.node_id });
              } catch (error) {
                if (!/already|linked/i.test(String(error.message))) throw error;
              }

              for (const label of labelDefinitions) {
                try {
                  await github.rest.issues.getLabel({ owner: repoOwner, repo, name: label.name });
                } catch (error) {
                  if (error.status !== 404) throw error;
                  await github.rest.issues.createLabel({ owner: repoOwner, repo, ...label });
                }
              }
            }

            async function getProjectMetadata() {
              const data = await github.graphql(`
                query($login: String!, $number: Int!) {
                  user(login: $login) {
                    projectV2(number: $number) {
                      id
                      fields(first: 100) {
                        nodes {
                          __typename
                          ... on ProjectV2Field { id name dataType }
                          ... on ProjectV2SingleSelectField { id name options { id name color description } }
                        }
                      }
                      views(first: 100) { nodes { id name layout } }
                    }
                  }
                }
              `, { login: owner, number: project.number });
              return data.user.projectV2;
            }

            let metadata = await getProjectMetadata();
            let statusField = metadata.fields.nodes.find((field) => field.name === 'Status' && field.__typename === 'ProjectV2SingleSelectField');
            if (!statusField) throw new Error('The project does not expose the built-in Status field.');

            const desiredNames = statuses.map((status) => status.name);
            const existingNames = statusField.options.map((option) => option.name);
            if (JSON.stringify(existingNames) !== JSON.stringify(desiredNames)) {
              const options = statuses.map((status) => {
                const existing = statusField.options.find((option) => option.name === status.name);
                return existing ? { ...status, id: existing.id } : status;
              });

              await github.graphql(`
                mutation($fieldId: ID!, $options: [ProjectV2SingleSelectFieldOptionInput!]!) {
                  updateProjectV2Field(input: { fieldId: $fieldId, singleSelectOptions: $options }) {
                    projectV2Field { __typename }
                  }
                }
              `, { fieldId: statusField.id, options });
            }

            async function ensureField(name, dataType) {
              metadata = await getProjectMetadata();
              const existing = metadata.fields.nodes.find((field) => field.name === name);
              if (existing) return existing;

              await github.graphql(`
                mutation($projectId: ID!, $name: String!, $dataType: ProjectV2CustomFieldType!) {
                  createProjectV2Field(input: { projectId: $projectId, name: $name, dataType: $dataType }) {
                    projectV2Field { __typename }
                  }
                }
              `, { projectId: project.id, name, dataType });

              metadata = await getProjectMetadata();
              return metadata.fields.nodes.find((field) => field.name === name);
            }

            const chantierField = await ensureField('Chantier', 'TEXT');
            const nextStepField = await ensureField('Next step', 'TEXT');
            const progressField = await ensureField('Progress', 'NUMBER');

            metadata = await getProjectMetadata();
            statusField = metadata.fields.nodes.find((field) => field.name === 'Status' && field.__typename === 'ProjectV2SingleSelectField');
            const statusOptions = new Map(statusField.options.map((option) => [option.name, option.id]));
            const visibleFieldIds = [statusField.id, chantierField.id, nextStepField.id, progressField.id];

            async function ensureView(name, layout, filter = null) {
              metadata = await getProjectMetadata();
              let view = metadata.views.nodes.find((candidate) => candidate.name === name);
              try {
                if (!view) {
                  const created = await github.graphql(`
                    mutation($projectId: ID!, $name: String!, $layout: ProjectV2ViewLayout!, $configuration: ProjectV2ViewConfigurationInput) {
                      createProjectV2View(input: { projectId: $projectId, name: $name, layout: $layout, configuration: $configuration }) {
                        projectV2View { id name }
                      }
                    }
                  `, { projectId: project.id, name, layout, configuration: { visibleFieldIds } });
                  view = created.createProjectV2View.projectV2View;
                }
                if (filter) {
                  await github.graphql(`
                    mutation($viewId: ID!, $filter: String!) {
                      updateProjectV2View(input: { viewId: $viewId, filter: $filter }) {
                        projectV2View { id }
                      }
                    }
                  `, { viewId: view.id, filter });
                }
              } catch (error) {
                core.warning(`Could not create/update view ${name}: ${error.message}`);
              }
            }

            await ensureView('Current Work', 'BOARD_LAYOUT');
            await ensureView('All Work', 'TABLE_LAYOUT');
            await ensureView('Pull Requests', 'TABLE_LAYOUT', 'is:pr');
            for (const fullName of repositories) {
              await ensureView(fullName.split('/')[1], 'BOARD_LAYOUT', `repo:${fullName}`);
            }

            async function getProjectItems() {
              const items = [];
              let after = null;
              do {
                const data = await github.graphql(`
                  query($login: String!, $number: Int!, $after: String) {
                    user(login: $login) {
                      projectV2(number: $number) {
                        items(first: 100, after: $after) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            id
                            statusValue: fieldValueByName(name: "Status") {
                              ... on ProjectV2ItemFieldSingleSelectValue { name }
                            }
                            chantierValue: fieldValueByName(name: "Chantier") {
                              ... on ProjectV2ItemFieldTextValue { text }
                            }
                            nextStepValue: fieldValueByName(name: "Next step") {
                              ... on ProjectV2ItemFieldTextValue { text }
                            }
                            progressValue: fieldValueByName(name: "Progress") {
                              ... on ProjectV2ItemFieldNumberValue { number }
                            }
                            content {
                              __typename
                              ... on Issue {
                                id number title body state url
                                repository { nameWithOwner }
                                labels(first: 50) { nodes { name } }
                              }
                              ... on PullRequest {
                                id number title body state url isDraft merged mergedAt
                                repository { nameWithOwner }
                                labels(first: 50) { nodes { name } }
                                commits(last: 1) {
                                  nodes { commit { statusCheckRollup { state } } }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `, { login: owner, number: project.number, after });

                const connection = data.user.projectV2.items;
                items.push(...connection.nodes);
                after = connection.pageInfo.hasNextPage ? connection.pageInfo.endCursor : null;
              } while (after);
              return items;
            }

            let items = await getProjectItems();
            const existingContentIds = new Set(items.map((item) => item.content?.id).filter(Boolean));

            for (const fullName of repositories) {
              const [repoOwner, repo] = fullName.split('/');
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: repoOwner, repo, state: 'open', per_page: 100
              });
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner: repoOwner, repo, state: 'open', per_page: 100
              });

              const nodeIds = [
                ...issues.filter((issue) => !issue.pull_request).map((issue) => issue.node_id),
                ...pulls.map((pull) => pull.node_id),
              ];

              for (const contentId of nodeIds) {
                if (existingContentIds.has(contentId)) continue;
                try {
                  await github.graphql(`
                    mutation($projectId: ID!, $contentId: ID!) {
                      addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                        item { id }
                      }
                    }
                  `, { projectId: project.id, contentId });
                  existingContentIds.add(contentId);
                } catch (error) {
                  if (!/already|exists/i.test(String(error.message))) throw error;
                }
              }
            }

            items = await getProjectItems();
            const trackedRepositories = new Set(repositories);

            async function setField(itemId, fieldId, value) {
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: ProjectV2FieldValue!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId,
                    itemId: $itemId,
                    fieldId: $fieldId,
                    value: $value
                  }) { projectV2Item { id } }
                }
              `, { projectId: project.id, itemId, fieldId, value });
            }

            let changed = 0;
            for (const item of items) {
              const content = item.content;
              if (!content?.repository?.nameWithOwner || !trackedRepositories.has(content.repository.nameWithOwner)) continue;

              const desiredStatus = inferStatus(content);
              const optionId = statusOptions.get(desiredStatus);
              if (optionId && item.statusValue?.name !== desiredStatus) {
                await setField(item.id, statusField.id, { singleSelectOptionId: optionId });
                changed += 1;
              }

              const chantier = marker(content.body, 'chantier');
              if (chantier && item.chantierValue?.text !== chantier) {
                await setField(item.id, chantierField.id, { text: chantier });
                changed += 1;
              }

              const nextStep = marker(content.body, 'next');
              if (nextStep && item.nextStepValue?.text !== nextStep) {
                await setField(item.id, nextStepField.id, { text: nextStep });
                changed += 1;
              }

              const progress = inferProgress(content);
              if (progress !== null && item.progressValue?.number !== progress) {
                await setField(item.id, progressField.id, { number: progress });
                changed += 1;
              }
            }

            core.summary
              .addHeading(projectTitle)
              .addRaw(`Project: https://github.com/users/${owner}/projects/${project.number}\n`)
              .addRaw(`Repositories: ${repositories.length}\n`)
              .addRaw(`Tracked items: ${items.filter((item) => trackedRepositories.has(item.content?.repository?.nameWithOwner)).length}\n`)
              .addRaw(`Field updates: ${changed}\n`)
              .write();
