services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-jobpilot} -d ${POSTGRES_DB:-jobpilot}"
        ]
      interval: 3s
      timeout: 3s
      retries: 20

    volumes:
      - jobpilot_db:/var/lib/postgresql/data

  api:
    build:
      context: ./api

    entrypoint:
      - sh
      - ./docker-entrypoint.sh

    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      APP_SECRET: ${APP_SECRET:-change-me}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}

      DATABASE_URL: postgresql://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD:-jobpilot}@db:5432/${POSTGRES_DB:-jobpilot}?serverVersion=17&charset=utf8

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/integrations/gmail/callback}

      WEB_URL: ${WEB_URL:-http://localhost:3000}

      GMAIL_SEARCH_QUERY: "${GMAIL_SEARCH_QUERY:-(job OR mission OR candidature OR application OR recruiter) newer_than:30d}"

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      # Bind mount: Symfony files are read directly from your Mac.
      - ./api:/app

      # Keep Composer dependencies inside Docker.
      - api_vendor:/app/vendor

      # Initial application data.
      - ./initial-data:/app/initial-data:ro

      # Keep generated Symfony files out of the Mac source folder.
      - api_cache:/app/var/cache
      - api_logs:/app/var/log

      # Persistent private data and uploaded CVs.
      - jobpilot_private:/app/var/private

  web:
    build:
      context: ./web

    environment:
      NEXT_PUBLIC_API_URL: /api
      API_INTERNAL_URL: http://api:8080

      # More reliable file watching with Docker Desktop on macOS.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      - api

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      # Bind mount: Next.js files are read directly from your Mac.
      - ./web:/app

      # Keep Linux Node dependencies inside Docker.
      - web_node_modules:/app/node_modules

      # Keep Next.js generated files inside Docker.
      - web_next:/app/.next

volumes:
  jobpilot_db:
  jobpilot_private:

  api_vendor:
  api_cache:
  api_logs:

  web_node_modules:
  web_next: