name: CI

on:
  push:
    branches: [main, fix/full-test-suite]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner-preflight:
    name: Runner disk preflight
    runs-on: [self-hosted, jobpilot]
    timeout-minutes: 5
    steps:
      - name: Reclaim safe CI disk space
        shell: bash
        run: |
          set -euo pipefail

          echo "Disk usage before cleanup:"
          df -h /
          docker system df || true

          # Generated dependency/build output is recreated by the jobs below.
          # Cleaning it here is important because service containers are started
          # before normal job steps and therefore need free disk beforehand.
          rm -rf \
            "$GITHUB_WORKSPACE/web/node_modules" \
            "$GITHUB_WORKSPACE/web/.next" \
            "$GITHUB_WORKSPACE/web/test-results" \
            "$GITHUB_WORKSPACE/web/playwright-report" \
            "$GITHUB_WORKSPACE/api/vendor" \
            "$GITHUB_WORKSPACE/api/var"

          docker container prune --force || true
          # GitHub Actions Postgres services leave anonymous data volumes behind.
          # `docker volume prune` removes unused anonymous volumes by default and
          # does not remove named volumes unless `--all` is explicitly supplied.
          docker volume prune --force || true
          docker image rm --force jobpilot-browser-worker:ci 2>/dev/null || true
          docker image prune --force || true
          docker builder prune --force || true

          echo "Disk usage after cleanup:"
          df -h /
          docker system df || true

          available_kb="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          minimum_kb=$((4 * 1024 * 1024))
          if [ "$available_kb" -lt "$minimum_kb" ]; then
            echo "::error::Le runner JobPilot dispose de moins de 4 Gio libres après le nettoyage CI. Libérer de l'espace sur la VM avant de lancer les tests lourds."
            exit 1
          fi

  backend:
    name: Backend tests
    needs: [runner-preflight]
    runs-on: [self-hosted, jobpilot]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jobpilot_test
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpilot -d jobpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: test-secret
      APP_ENCRYPTION_KEY: ""
      DATABASE_URL: postgresql://jobpilot:jobpilot@127.0.0.1:5432/jobpilot_test?serverVersion=17&charset=utf8
      ARBEITNOW_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        env:
          runner: self-hosted
        with:
          php-version: '8.4'
          extensions: ctype, dom, iconv, intl, json, mbstring, pdo_pgsql, sodium, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Install backend dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare initial data
        run: cp -R initial-data api/initial-data
      - name: Validate Symfony configuration
        working-directory: api
        run: |
          php bin/console lint:yaml --parse-tags config
          php bin/console lint:container
      - name: Create test database
        working-directory: api
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console app:bootstrap --no-interaction
          echo "Doctrine schema difference:"
          php bin/console doctrine:schema:update --dump-sql
          php bin/console doctrine:schema:validate
      - name: Run PHPUnit
        working-directory: api
        run: php bin/phpunit
      - name: Reclaim backend workspace artifacts
        if: always()
        run: rm -rf api/vendor api/var

  frontend:
    name: Frontend tests
    needs: [runner-preflight]
    runs-on: [self-hosted, jobpilot]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run frontend unit tests
        run: npm run test:unit
      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: /api
          API_INTERNAL_URL: http://127.0.0.1:8080
        run: npm run build
      - name: Reclaim frontend workspace artifacts
        if: always()
        run: rm -rf node_modules .next test-results playwright-report

  compose-config:
    name: Docker Compose configuration
    needs: [runner-preflight]
    runs-on: [self-hosted, jobpilot]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Validate image-only configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate local development configuration
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet

  e2e:
    name: Chromium end-to-end tests
    needs: [backend, frontend, compose-config]
    runs-on: [self-hosted, jobpilot]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jobpilot_e2e
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpilot -d jobpilot_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: e2e-secret
      APP_ENCRYPTION_KEY: ""
      DATABASE_URL: postgresql://jobpilot:jobpilot@127.0.0.1:5432/jobpilot_e2e?serverVersion=17&charset=utf8
      ARBEITNOW_ENABLED: 0
      LE_STUDIO_TECH_ENABLED: 0
      NEXT_PUBLIC_API_URL: /api
      API_INTERNAL_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Reclaim disk before browser job
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            web/node_modules \
            web/.next \
            web/test-results \
            web/playwright-report \
            api/vendor \
            api/var
          docker container prune --force || true
          docker volume prune --force || true
          docker image rm --force jobpilot-browser-worker:ci 2>/dev/null || true
          docker image prune --force || true
          docker builder prune --force || true
          echo "Disk usage before E2E dependencies:"
          df -h /
          docker system df || true
          available_kb="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          minimum_kb=$((4 * 1024 * 1024))
          if [ "$available_kb" -lt "$minimum_kb" ]; then
            echo "::error::Le runner JobPilot dispose de moins de 4 Gio libres avant l'E2E Chromium."
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        env:
          runner: self-hosted
        with:
          php-version: '8.4'
          extensions: ctype, dom, iconv, intl, json, mbstring, pdo_pgsql, sodium, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare isolated Chromium runtime
        run: docker build --tag jobpilot-browser-worker:ci browser-worker

      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build Next.js for browser tests
        working-directory: web
        run: npm run build

      - name: Prepare E2E database
        run: |
          cp -R initial-data api/initial-data
          cd api
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console app:bootstrap --no-interaction

      - name: Configure Symfony HTTP runtime
        run: |
          cat > api/.env.local <<'EOF'
          APP_ENV=dev
          APP_DEBUG=1
          APP_SECRET=e2e-secret
          APP_ENCRYPTION_KEY=
          DATABASE_URL=postgresql://jobpilot:jobpilot@127.0.0.1:5432/jobpilot_e2e?serverVersion=17&charset=utf8
          ARBEITNOW_ENABLED=0
          LE_STUDIO_TECH_ENABLED=0
          ADZUNA_APP_ID=
          ADZUNA_APP_KEY=
          EOF
          rm -rf api/var/cache/dev

      - name: Start Symfony API
        run: |
          cd api
          nohup env APP_ENV=dev APP_DEBUG=1 php -S 127.0.0.1:8080 -t public public/index.php > /tmp/jobpilot-api.log 2>&1 &
          echo $! > /tmp/jobpilot-api.pid

      - name: Wait for Symfony API and database endpoints
        run: |
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --show-error --silent http://127.0.0.1:8080/api/health >/dev/null || {
            cat /tmp/jobpilot-api.log || true
            exit 1
          }
          curl --fail --show-error --silent http://127.0.0.1:8080/api/profile >/tmp/jobpilot-profile.json || {
            cat /tmp/jobpilot-api.log || true
            exit 1
          }
          curl --fail --show-error --silent http://127.0.0.1:8080/api/dashboard >/tmp/jobpilot-dashboard.json || {
            cat /tmp/jobpilot-api.log || true
            exit 1
          }

      - name: Start Next.js production server
        working-directory: web
        run: |
          nohup npm run start > /tmp/jobpilot-web.log 2>&1 &
          echo $! > /tmp/jobpilot-web.pid

      - name: Wait for Next.js
        run: |
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/jobpilot-api.log || true
          cat /tmp/jobpilot-web.log || true
          exit 1

      - name: Run Playwright in isolated browser container
        run: |
          docker run --rm \
            --network host \
            --ipc host \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env CI=true \
            --env PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 \
            --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --volume "$PWD/web:/workspace" \
            --workdir /workspace \
            jobpilot-browser-worker:ci \
            npm run test:e2e

      - name: Show application logs on failure
        if: failure()
        run: |
          cat /tmp/jobpilot-api.log || true
          cat /tmp/jobpilot-web.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop application servers
        if: always()
        run: |
          test ! -f /tmp/jobpilot-web.pid || kill "$(cat /tmp/jobpilot-web.pid)" || true
          test ! -f /tmp/jobpilot-api.pid || kill "$(cat /tmp/jobpilot-api.pid)" || true

      - name: Reclaim browser CI artifacts
        if: always()
        run: |
          rm -rf \
            web/node_modules \
            web/.next \
            web/test-results \
            web/playwright-report \
            api/vendor \
            api/var
          docker image rm --force jobpilot-browser-worker:ci 2>/dev/null || true
          docker container prune --force || true
          docker image prune --force || true
          docker builder prune --force || true
          df -h /
