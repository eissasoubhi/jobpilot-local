name: CI

on:
  push:
    branches: [main, fix/full-test-suite]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-bundle:
    name: Apply consolidated audit bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply bundle when present
        shell: bash
        run: |
          if [ ! -f tools/apply_bundle.py ]; then
            echo "No temporary bundle to apply"
            exit 0
          fi
          python3 tools/apply_bundle.py
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/apply-bundle.yml
          rm -f tools/bundle.part* tools/apply_bundle.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No source changes produced"
            exit 0
          fi
          git commit -m "Apply audited fixes and test suite [bundle applied]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  backend:
    name: Backend tests
    needs: apply-bundle
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jobpilot_test
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpilot -d jobpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: test-secret
      APP_ENCRYPTION_KEY: ""
      DATABASE_URL: postgresql://jobpilot:jobpilot@127.0.0.1:5432/jobpilot_test?serverVersion=17&charset=utf8
      ARBEITNOW_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, iconv, intl, json, mbstring, pdo_pgsql, sodium, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Install backend dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare initial data
        run: cp -R initial-data api/initial-data
      - name: Validate Symfony configuration
        working-directory: api
        run: |
          php bin/console lint:yaml --parse-tags config
          php bin/console lint:container
      - name: Create test database
        working-directory: api
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console app:bootstrap --no-interaction
          echo "Doctrine schema difference:"
          php bin/console doctrine:schema:update --dump-sql
          php bin/console doctrine:schema:validate
      - name: Run PHPUnit
        working-directory: api
        run: php bin/phpunit

  frontend:
    name: Frontend tests
    needs: apply-bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run frontend unit tests
        run: npm run test:unit
      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: /api
          API_INTERNAL_URL: http://127.0.0.1:8080
        run: npm run build

  e2e:
    name: Chromium end-to-end tests
    needs: apply-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARBEITNOW_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Build API and frontend images
        run: timeout 12m docker compose -f docker-compose.yml build --progress=plain api web

      - name: Start PostgreSQL
        run: docker compose -f docker-compose.yml up -d --no-build db

      - name: Wait for PostgreSQL
        run: |
          for i in {1..60}; do
            if docker compose -f docker-compose.yml exec -T db pg_isready -U jobpilot -d jobpilot >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --no-color --tail=300 db
          exit 1

      - name: Start Symfony API
        run: docker compose -f docker-compose.yml up -d --no-build api

      - name: Wait for Symfony API
        run: |
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --no-color --tail=500 db api
          exit 1

      - name: Start Next.js
        run: docker compose -f docker-compose.yml up -d --no-build web

      - name: Wait for Next.js
        run: |
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --no-color --tail=500 api web
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright dependencies
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color --tail=500 db api web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml down -v --remove-orphans
